# Copy to your vault root as second-brain.yml (second-brain init does this
# for you automatically). Every value here is optional beyond what init sets.

vault: .

connectors:
  capture:
    enabled: true
    # Bounds one full sync attempt (discover+fetch+normalise+extract_claims
    # +update_cursor) via resilience.run_step - not any single network call
    # inside it. This is an illustrative starting point, not a measured
    # optimum: widen it if your own capture inbox legitimately has more to
    # process per run than this assumes.
    session_timeout_seconds: 60
  x_bookmarks:
    enabled: false   # needs X_CLIENT_ID in a .env at the vault root
    session_timeout_seconds: 180

governance:
  # cli = approve/reject via `second-brain approve|reject`.
  approval_channel: cli

notifications:
  # Deterministic outbox (second_brain/outbox.py): a sync step only ever
  # durably creates a proposal; delivery happens afterwards, in a separate,
  # idempotent step, so a retried sync can never re-send a proposal that
  # already went out. See docs/architecture.md.
  enabled: false
  channel: null   # e.g. "telegram" - see outbox.TelegramNotifier
  telegram:
    # Never put a real token here - both are read from environment
    # variables at send time.
    bot_token_env: SECOND_BRAIN_TELEGRAM_BOT_TOKEN
    chat_id_env: SECOND_BRAIN_TELEGRAM_CHAT_ID

watchdog:
  # second_brain/watchdog.py - run as its OWN separate scheduled job, not
  # as a step inside sync. See that module's docstring for why.
  stale_after_hours: 36

distribution:
  openlore:
    enabled: false
    # A plain directory OpenLore is pointed at. It serves this directory
    # live, directly, with no separate publish/ingestion step - see
    # docs/openlore-integration.md.
    publish_path: null
